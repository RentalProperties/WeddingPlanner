            >
              <div
                style={{
                  width: 68,
                  flexShrink: 0,
                  background: COLORS.champagne,
                  borderRight: `1px solid ${COLORS.border}`,
                  position: "relative",
                  height: totalHeight,
                }}
              >
                {timeSlots.map((min) => (
                  <div
                    key={min}
                    style={{
                      position: "absolute",
                      top: ((min - startMin) / interval) * SLOT_HEIGHT - 8,
                      left: 0,
                      right: 0,
                      textAlign: "right",
                      paddingRight: 10,
                      fontSize: 10,
                      fontFamily: "'DM Sans', sans-serif",
                      fontWeight: min % 60 === 0 ? 600 : 400,
                      color: min % 60 === 0 ? COLORS.ink : COLORS.muted,
                      userSelect: "none",
                    }}
                  >
                    {formatTime(min)}
                  </div>
                ))}
              </div>

              <div
                style={{
                  flex: 1,
                  position: "relative",
                  height: totalHeight,
                  cursor: "crosshair",
                }}
                onClick={handleAreaClick}
              >
                {timeSlots.map((min) => (
                  <div
                    key={min}
                    style={{
                      position: "absolute",
                      top: ((min - startMin) / interval) * SLOT_HEIGHT,
                      left: 0,
                      right: 0,
                      height: min % 60 === 0 ? 1.5 : 1,
                      background:
                        min % 60 === 0 ? COLORS.champagneDark : COLORS.border,
                      pointerEvents: "none",
                    }}
                  />
                ))}

                {events.length === 0 && (
                  <div
                    style={{
                      position: "absolute",
                      inset: 0,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      pointerEvents: "none",
                    }}
                  >
                    <div style={{ textAlign: "center", opacity: 0.5 }}>
                      <div style={{ fontSize: 36, marginBottom: 10 }}>🕐</div>
                      <div
                        style={{
                          fontSize: 13,
                          color: COLORS.muted,
                          fontFamily: "'DM Sans', sans-serif",
                        }}
                      >
                        {t("tl_click_to_add")}
                      </div>
                    </div>
                  </div>
                )}

                {sortedEvents.map((event) => {
                  const top = timeToPixel(event.startTime);
                  const height = Math.max(
                    durationToPixel(event.duration),
                    SLOT_HEIGHT * 0.45,
                  );
                  return (
                    <div
                      key={event.id}
                      onClick={(e) => {
                        e.stopPropagation();
                        setModalState({ isNew: false, event });
                      }}
                      onMouseEnter={(e) =>
                        (e.currentTarget.style.opacity = "0.78")
                      }
                      onMouseLeave={(e) =>
                        (e.currentTarget.style.opacity = "1")
                      }
                      style={{
                        position: "absolute",
                        top: top + 2,
                        left: 8,
                        right: 8,
                        height: height - 4,
                        background: event.color + "22",
                        borderLeft: `3px solid ${event.color}`,
                        borderRadius: 6,
                        padding: "5px 8px",
                        cursor: "pointer",
                        overflow: "hidden",
                        boxSizing: "border-box",
                        transition: "opacity 0.15s",
                      }}
                    >
                      <div
                        style={{
                          fontSize: 12,
                          fontWeight: 600,
                          color: event.color,
                          lineHeight: 1.3,
                          whiteSpace: "nowrap",
                          overflow: "hidden",
                          textOverflow: "ellipsis",
                        }}
                      >
                        {event.title}
                      </div>
                      {height > 28 && (
                        <div
                          style={{
                            fontSize: 11,
                            color: COLORS.muted,
                            lineHeight: 1.3,
                          }}
                        >
                          {event.startTime}
                          {event.duration >= interval
                            ? ` · ${event.duration} ${t("tl_min")}`
                            : ""}
                          {event.category ? ` · ${event.category}` : ""}
                        </div>
                      )}
                      {height > 56 && event.description && (
                        <div
                          style={{
                            fontSize: 11,
                            color: COLORS.muted,
                            marginTop: 2,
                            overflow: "hidden",
                            lineHeight: 1.3,
                          }}
                        >
                          {event.description}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Event summary pills */}
            {sortedEvents.length > 0 && (
              <div
                style={{
                  display: "flex",
                  gap: 6,
                  marginTop: 14,
                  flexWrap: "wrap",
                }}
              >
                {sortedEvents.map((ev) => (
                  <div
                    key={ev.id}
                    onClick={() => setModalState({ isNew: false, event: ev })}
                    onMouseEnter={(e) =>
                      (e.currentTarget.style.opacity = "0.72")
                    }
                    onMouseLeave={(e) => (e.currentTarget.style.opacity = "1")}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 6,
                      padding: "5px 12px",
                      background: ev.color + "18",
                      border: `1px solid ${ev.color}44`,
                      borderRadius: 20,
                      cursor: "pointer",
                      fontSize: 12,
                      color: COLORS.ink,
                      fontFamily: "'DM Sans', sans-serif",
                      transition: "opacity 0.15s",
                    }}
                  >
                    <span
                      style={{
                        width: 8,
                        height: 8,
                        borderRadius: "50%",
                        background: ev.color,
                        display: "inline-block",
                        flexShrink: 0,
                      }}
                    />
                    <span style={{ fontWeight: 500 }}>{ev.startTime}</span>
                    {ev.title}
                  </div>
                ))}
              </div>
            )}

            {modalState && (
              <TimelineEventModal
                event={modalState.isNew ? null : modalState.event}
                isNew={modalState.isNew}
                defaultStartTime={
                  modalState.clickedTime ||
                  (modalState.event && modalState.event.startTime) ||
                  formatTime(startMin)
                }
                onSave={handleSave}
                onDelete={handleDelete}
                onClose={() => setModalState(null)}
              />
            )}

            {dayModal && (
              <TimelineDayModal
                day={dayModal.day}
                isNew={dayModal.isNew}
                dayCount={days.length}
                onSave={dayModal.isNew ? handleAddDay : handleEditDay}
                onDelete={handleDeleteDay}
                onClose={() => setDayModal(null)}
              />
            )}
          </div>
        );
      }

      const NAV_ITEMS = [
        { id: "overview", icon: "🌸" },
        { id: "budget", icon: "💰" },
        { id: "guests", icon: "👥" },
        { id: "tables", icon: "🪑" },
        { id: "venues", icon: "🏛" },
        { id: "photographers", icon: "📷" },
        { id: "vendors", icon: "🎀" },
        { id: "checklist", icon: "✅" },
        { id: "timeline", icon: "🕐" },
      ];

      function WeddingPlanner() {
        const isMobile = useIsMobile();
        const [activeTab, setActiveTab] = useState("overview");
        const [venues, setVenues] = useState([]);
        const [photographers, setPhotographers] = useState([]);
        const [budget, setBudget] = useState({ total: 0, categories: [] });
        const [guests, setGuests] = useState([]);
        const [tables, setTables] = useState([]);
        const [checklist, setChecklist] = useState([]);
        const [checklistCategories, setChecklistCategories] = useState([]);
        const _checklistRef = React.useRef([]);
        const _checklistCatsRef = React.useRef([]);
        const [vendors, setVendors] = useState([]);
        const [timeline, setTimeline] = useState(DEFAULT_TIMELINE);
        const [navItems] = useState(NAV_ITEMS);
        const [lang, setLangState] = useState(
          () =>
            (typeof localStorage !== "undefined" &&
              localStorage.getItem("wp_lang")) ||
            "en",
        );
        const [meta, setMeta] = useState({
          wedding_date: "2025-09-20",
          partner1_name: "Emma",
          partner2_name: "James",
          title_type: "Reception Planner",
        });
        const [showMetaEdit, setShowMetaEdit] = useState(false);
        const [metaInput, setMetaInput] = useState(null);
        const [showSetupModal, setShowSetupModal] = useState(false);
        const [setupForm, setSetupForm] = useState({
          owner: "",
          repo: "",
          token: "",
        });
        const [isSaved, setIsSaved] = useState(true);
        const [isSaving, setIsSaving] = useState(false);

        useEffect(() => {
          const style = document.createElement("style");
          style.textContent = fonts;
          document.head.appendChild(style);

          // Load data from GitHubDataStore
          window.GitHubDataStore.loadAll()
            .then((data) => {
              if (!data) return;
              setVenues(data.venues || []);
              setPhotographers(data.photographers || []);
              setBudget(data.budget || { total: 0, categories: [] });
              setGuests(data.guests || []);
              setTables(data.tables || []);
              const rawCl = data.checklist;
              const clTasks = Array.isArray(rawCl)
                ? rawCl
                : rawCl && rawCl.tasks
                  ? rawCl.tasks
                  : [];
              const clCats =
                !Array.isArray(rawCl) && rawCl && rawCl.categories
                  ? rawCl.categories
                  : [];
              _checklistRef.current = clTasks;
              _checklistCatsRef.current = clCats;
              setChecklist(clTasks);
              setChecklistCategories(clCats);
              setVendors(data.vendors || []);
              setTimeline(data.timeline || DEFAULT_TIMELINE);
              if (data.meta) {
                setMeta(data.meta);
                if (data.meta.lang) {
                  setLangState(data.meta.lang);
                  try {
                    localStorage.setItem("wp_lang", data.meta.lang);
                  } catch (_) {}
                }
              }
              setIsSaved(true);
            })
            .catch((e) => console.warn("GitHubDataStore.loadAll failed", e));

          return () => document.head.removeChild(style);
        }, []);

        // helper to persist any collection: update state then save via server API
        const createPersistSetter = (key, setter) => (updater) => {
          setter((prev) => {
            const next =
              typeof updater === "function" ? updater(prev) : updater;
            setIsSaved(false);
            return next;
          });
        };

        const setVenuesPersist = createPersistSetter("venues", setVenues);
        const setPhotographersPersist = createPersistSetter(
          "photographers",
          setPhotographers,
        );
        const setBudgetPersist = createPersistSetter("budget", setBudget);
        const setGuestsPersist = createPersistSetter("guests", setGuests);
        const setTablesPersist = createPersistSetter("tables", setTables);
        const setChecklistPersist = (updater) => {
          setChecklist((prev) => {
            const next =
              typeof updater === "function" ? updater(prev) : updater;
            _checklistRef.current = next;
            setIsSaved(false);
            return next;
          });
        };

        const setChecklistCategoriesPersist = (newCats) => {
          _checklistCatsRef.current = newCats;
          setChecklistCategories(newCats);
          setIsSaved(false);
        };
        const setVendorsPersist = createPersistSetter("vendors", setVendors);
        const setTimelinePersist = createPersistSetter("timeline", setTimeline);

        const saveMeta = (newMeta) => {
          setMeta(newMeta);
          // Mark unsaved so the Save button enables; handleSaveAll pushes
          // meta to GitHub as part of the atomic commit.
          setIsSaved(false);
        };

        const setLang = (newLang) => {
          setLangState(newLang);
          try {
            localStorage.setItem("wp_lang", newLang);
          } catch (_) {}
          const updatedMeta = { ...meta, lang: newLang };
          saveMeta(updatedMeta);
        };

        const t = (key, vars = {}) => {
          const dict = TRANSLATIONS[lang] || TRANSLATIONS.en;
          const str = dict[key] ?? TRANSLATIONS.en[key] ?? key;
          return Object.entries(vars).reduce(
            (s, [k, v]) => s.replace(`{${k}}`, String(v)),
            str,
          );
        };

        const ctxValue = { t, lang, setLang };

        const handleSetupSubmit = async () => {
          if (!setupForm.owner || !setupForm.repo || !setupForm.token) {
            alert("Please fill in all fields");
            return;
          }
          try {
            window.GitHubDataStore.setConfig(
              setupForm.owner,
              setupForm.repo,
              setupForm.token
            );
            setShowSetupModal(false);
            window.location.reload();
          } catch (e) {
            alert("Failed to connect to GitHub: " + e.message);
          }
        };

        const handleSaveAll = async () => {
          const config = window.GitHubDataStore.getConfig();
          if (!config || !config.token) {
            setShowSetupModal(true);
            return;
          }
          setIsSaving(true);
          try {
            const ds = window.GitHubDataStore;
            // Pass current React state directly to saveAll for atomic push
            await ds.saveAll({
              venues,
              photographers,
              budget,
              guests,
              tables,
              checklist: { tasks: checklist, categories: checklistCategories },
              vendors,
              timeline,
              meta,
            });
            setIsSaved(true);
          } catch (e) {
            console.error("Failed to save:", e);
            alert("Failed to save: " + e.message);
          } finally {
            setIsSaving(false);
          }
        };

        const navLabelKeys = {
          overview: "nav_overview",
          budget: "nav_budget",
          venues: "nav_venues",
          photographers: "nav_photographers",
          guests: "nav_guests",
          tables: "nav_seating",
          checklist: "nav_checklist",
          vendors: "nav_vendors",
          timeline: "nav_timeline",
        };

        const renderContent = () => {
          switch (activeTab) {
            case "overview":
              return (
                <Overview
                  budget={budget}
                  guests={guests}
                  checklist={checklist}
                  venues={venues}
                  photographers={photographers}
                  meta={meta}
                />
              );
            case "budget":
              return <Budget budget={budget} setBudget={setBudgetPersist} />;
            case "venues":
              return <Venues venues={venues} setVenues={setVenuesPersist} />;
            case "photographers":
              return (
                <Photographers
                  photographers={photographers}
                  setPhotographers={setPhotographersPersist}
                />
              );
            case "guests":
              return <Guests guests={guests} setGuests={setGuestsPersist} />;
            case "tables":
              return (
                <Tables
                  guests={guests}
                  setGuests={setGuestsPersist}
                  tables={tables}
                  setTables={setTablesPersist}
                />
              );
            case "checklist":
              return (
                <Checklist
                  checklist={checklist}
                  setChecklist={setChecklistPersist}
                  checklistCategories={checklistCategories}
                  setChecklistCategories={setChecklistCategoriesPersist}
                />
              );
            case "vendors":
              return (
                <Vendors
                  vendors={vendors}
                  setVendors={setVendorsPersist}
                  budget={budget}
                  setBudget={setBudgetPersist}
                />
              );
            case "timeline":
              return (
                <Timeline
                  timeline={timeline}
                  setTimeline={setTimelinePersist}
                />
              );
            default:
              return null;
          }
        };

        return (
          <LangContext.Provider value={ctxValue}>
            <div
              style={{
                display: "flex",
                flexDirection: isMobile ? "column" : "row",
                minHeight: "100vh",
                background: COLORS.bg,
                fontFamily: "'DM Sans', sans-serif",
              }}
            >
              <div
                style={{
                  width: isMobile ? "100%" : 220,
                  background: COLORS.white,
                  borderRight: isMobile
                    ? "none"
                    : `1px solid ${COLORS.border}`,
                  borderBottom: isMobile
                    ? `1px solid ${COLORS.border}`
                    : "none",
                  display: "flex",
                  flexDirection: "column",
                  flexShrink: 0,
                  position: isMobile ? "static" : "sticky",
                  top: 0,
                  height: isMobile ? "auto" : "100vh",
                  boxSizing: "border-box",
                }}
              >
                <div
                  style={{
                    padding: "28px 20px 20px",
                    borderBottom: `1px solid ${COLORS.border}`,
                  }}
                >
                  <div
                    onClick={() => {
                      setMetaInput({ ...meta });
                      setShowMetaEdit((s) => !s);
                    }}
                    title="Click to edit event details"
                    style={{
                      cursor: "pointer",
                    }}
                  >
                    <div
                      style={{
                        fontFamily: "'Cormorant Garamond', serif",
                        fontSize: 13,
                        color: COLORS.rose,
                        letterSpacing: "0.15em",
                        textTransform: "uppercase",
                        marginBottom: 2,
                      }}
                    >
                      {meta.title_type || "Reception Planner"}
                    </div>
                    <div
                      style={{
                        fontFamily: "'Cormorant Garamond', serif",
                        fontSize: 22,
                        fontWeight: 500,
                        color: COLORS.ink,
                      }}
                    >
                      {meta.partner1_name || "Partner 1"}
                      {meta.title_type === "Wedding Planner" && (
                        <> & {meta.partner2_name || "Partner 2"}</>
                      )}
                    </div>
                    <div
                      style={{
                        fontFamily: "'DM Sans', sans-serif",
                        fontSize: 12,
                        color: COLORS.muted,
                        marginTop: 2,
                      }}
                    >
                      {meta.wedding_date
                        ? new Date(meta.wedding_date).toLocaleDateString(
                            undefined,
                            { year: "numeric", month: "long", day: "numeric" },
                          )
                        : ""}{" "}
                      ·{" "}
                      {Math.max(
                        0,
                        Math.ceil(
                          (new Date(meta.wedding_date) - new Date()) / 86400000,
                        ),
                      )}{" "}
                      {t("days")}
                    </div>
                  </div>
                  {showMetaEdit && metaInput && (
                    <div
                      style={{
                        marginTop: 12,
                        display: "flex",
                        flexDirection: "column",
                        gap: 8,
                      }}
                    >
                      <select
                        value={metaInput.title_type || "Reception Planner"}
                        onChange={(e) =>
                          setMetaInput((m) => ({
                            ...m,
                            title_type: e.target.value,
                          }))
                        }
                        style={{
                          width: "100%",
                          padding: "6px 8px",
                          border: `1px solid ${COLORS.border}`,
                          borderRadius: 8,
                          fontFamily: "'DM Sans', sans-serif",
                          fontSize: 12,
                          background: COLORS.white,
                        }}
                      >
                        <option>Wedding Planner</option>
                        <option>Baptism Planner</option>
                        <option>Reception Planner</option>
                        <option>Birthday Planner</option>
                        <option>Party Planner</option>
                        <option>Anniversary Planner</option>
                        <option>Event Planner</option>
                      </select>
                      <input
                        value={metaInput.partner1_name || ""}
                        onChange={(e) =>
                          setMetaInput((m) => ({
                            ...m,
                            partner1_name: e.target.value,
                          }))
                        }
                        placeholder="Partner 1 name"
                        style={{
                          width: "100%",
                          padding: "6px 8px",
                          border: `1px solid ${COLORS.border}`,
                          borderRadius: 8,
                          fontFamily: "'DM Sans', sans-serif",
                          fontSize: 12,
                          background: COLORS.white,
                          boxSizing: "border-box",
                        }}
                      />
                      <input
                        value={metaInput.partner2_name || ""}
                        onChange={(e) =>
                          setMetaInput((m) => ({
                            ...m,
                            partner2_name: e.target.value,
                          }))
                        }
                        placeholder="Partner 2 name"
                        style={{
                          width: "100%",
                          padding: "6px 8px",
                          border: `1px solid ${COLORS.border}`,
                          borderRadius: 8,
                          fontFamily: "'DM Sans', sans-serif",
                          fontSize: 12,
                          background: COLORS.white,
                          boxSizing: "border-box",
                        }}
                      />
                      <input
                        type="date"
                        value={metaInput.wedding_date || ""}
                        onChange={(e) =>
                          setMetaInput((m) => ({
                            ...m,
                            wedding_date: e.target.value,
                          }))
                        }
                        style={{
                          width: "100%",
                          padding: "6px 8px",
                          border: `1px solid ${COLORS.border}`,
                          borderRadius: 8,
                          fontFamily: "'DM Sans', sans-serif",
                          fontSize: 12,
                          background: COLORS.white,
                          boxSizing: "border-box",
                        }}
                      />
                      <button
                        onClick={() => {
                          saveMeta(metaInput);
                          setShowMetaEdit(false);
                        }}
                        style={{
                          padding: "6px 0",
                          background: COLORS.rose,
                          color: "#fff",
                          border: "none",
                          borderRadius: 8,
                          cursor: "pointer",
                          fontFamily: "'DM Sans', sans-serif",
                          fontSize: 12,
                          fontWeight: 500,
                        }}
                      >
                        {t("save")}
                      </button>
                    </div>
                  )}
                </div>
                <nav
                  style={{
                    padding: "12px 12px",
                    flex: 1,
                    display: isMobile ? "flex" : "block",
                    flexDirection: isMobile ? "row" : "column",
                    overflowX: isMobile ? "auto" : "visible",
                    WebkitOverflowScrolling: "touch",
                    gap: isMobile ? 4 : 0,
                  }}
                >
                  {navItems.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: 10,
                        width: isMobile ? "auto" : "100%",
                        flexShrink: 0,
                        whiteSpace: "nowrap",
                        padding: "10px 12px",
                        background:
                          activeTab === item.id
                            ? COLORS.roseLight
                            : "transparent",
                        border: "none",
                        borderRadius: 10,
                        cursor: "pointer",
                        marginBottom: 2,
                        textAlign: "left",
                        color:
                          activeTab === item.id ? COLORS.rose : COLORS.muted,
                        fontFamily: "'DM Sans', sans-serif",
                        fontSize: 14,
                        fontWeight: activeTab === item.id ? 500 : 400,
                        transition: "all 0.15s",
                      }}
                    >
                      <span style={{ fontSize: 16 }}>{item.icon}</span>
                      {navLabelKeys[item.id]
                        ? t(navLabelKeys[item.id])
                        : item.label}
                    </button>
                  ))}
                </nav>
                <div
                  style={{
                    padding: "16px 20px",
                    borderTop: `1px solid ${COLORS.border}`,
                  }}
                >
                  <button
                    onClick={handleSaveAll}
                    disabled={isSaved || isSaving}
                    style={{
                      width: "100%",
                      padding: "8px 12px",
                      background: isSaved ? "#4ade80" : "#eab308",
                      color: "#fff",
                      border: "none",
                      borderRadius: 8,
                      cursor: isSaved ? "default" : "pointer",
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 12,
                      fontWeight: 500,
                      opacity: isSaved ? 0.7 : 1,
                      transition: "background 0.2s",
                    }}
                  >
                    {isSaving
                      ? "Saving..."
                      : isSaved
                        ? "✓ Saved"
                        : "💾 Save"}
                  </button>
                  <div
                    style={{
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 10,
                      color: COLORS.border,
                      textAlign: "center",
                      marginTop: 8,
                      letterSpacing: "0.06em",
                    }}
                  >
                    v2.1
                  </div>
                </div>
              </div>

              <main
                style={{
                  flex: 1,
                  width: isMobile ? "100%" : "auto",
                  padding: isMobile ? "20px 14px" : "36px 40px",
                  overflowY: "auto",
                  maxWidth: isMobile ? "100%" : 900,
                  boxSizing: "border-box",
                }}
              >
                {renderContent()}
              </main>
            </div>

            {showSetupModal && (
              <div
                style={{
                  position: "fixed",
                  top: 0,
                  left: 0,
                  right: 0,
                  bottom: 0,
                  background: "rgba(0,0,0,0.5)",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  zIndex: 10000,
                }}
              >
                <div
                  style={{
                    background: "white",
                    borderRadius: 12,
                    padding: "32px",
                    maxWidth: 400,
                    boxShadow: "0 10px 40px rgba(0,0,0,0.1)",
                  }}
                >
                  <h2
                    style={{
                      margin: "0 0 8px 0",
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 20,
                      fontWeight: 600,
                      color: COLORS.dark,
                    }}
                  >
                    GitHub Setup
                  </h2>
                  <p
                    style={{
                      margin: "0 0 20px 0",
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 13,
                      color: COLORS.muted,
                    }}
                  >
                    Connect to your GitHub repository to save your planning data.
                  </p>
                  <input
                    type="text"
                    placeholder="GitHub Username"
                    value={setupForm.owner}
                    onChange={(e) =>
                      setSetupForm((f) => ({ ...f, owner: e.target.value }))
                    }
                    style={{
                      width: "100%",
                      padding: "8px 12px",
                      marginBottom: 12,
                      border: `1px solid ${COLORS.border}`,
                      borderRadius: 8,
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 12,
                      boxSizing: "border-box",
                    }}
                  />
                  <input
                    type="text"
                    placeholder="Repository Name"
                    value={setupForm.repo}
                    onChange={(e) =>
                      setSetupForm((f) => ({ ...f, repo: e.target.value }))
                    }
                    style={{
                      width: "100%",
                      padding: "8px 12px",
                      marginBottom: 12,
                      border: `1px solid ${COLORS.border}`,
                      borderRadius: 8,
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 12,
                      boxSizing: "border-box",
                    }}
                  />
                  <input
                    type="password"
                    placeholder="GitHub Personal Access Token"
                    value={setupForm.token}
                    onChange={(e) =>
                      setSetupForm((f) => ({ ...f, token: e.target.value }))
                    }
                    style={{
                      width: "100%",
                      padding: "8px 12px",
                      marginBottom: 20,
                      border: `1px solid ${COLORS.border}`,
                      borderRadius: 8,
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 12,
                      boxSizing: "border-box",
                    }}
                  />
                  <p
                    style={{
                      margin: "0 0 16px 0",
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 11,
                      color: COLORS.muted,
                    }}
                  >
                    Create a token at{" "}
                    <a
                      href="https://github.com/settings/tokens/new?scopes=repo"
                      target="_blank"
                      rel="noopener noreferrer"
                      style={{ color: COLORS.rose }}
                    >
                      github.com/settings/tokens
                    </a>
                    {" "}with <code>repo</code> scope.
                  </p>
                  <button
                    onClick={handleSetupSubmit}
                    style={{
                      width: "100%",
                      padding: "10px 16px",
                      background: COLORS.rose,
                      color: "#fff",
                      border: "none",
                      borderRadius: 8,
                      cursor: "pointer",
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 13,
                      fontWeight: 600,
                    }}
                  >
                    Connect
                  </button>
                </div>
              </div>
            )}
          </LangContext.Provider>
        );
      }

      ReactDOM.render(<WeddingPlanner />, document.getElementById("root"));
    </script>
  </body>
</html>
