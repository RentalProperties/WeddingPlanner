        background: #faf6f1;
      }
      /* --- Mobile / phone adaptations (<=768px) --- */
      @media (max-width: 768px) {
        /* Never let content push the page wider than the screen */
        html,
        body {
          overflow-x: hidden;
        }
        /* The whole UI is built with inline-styled multi-column grids
           (stat rows, forms, card layouts). On a phone there is no room
           for side-by-side columns, so collapse every grid to a single
           column. This targets the serialized inline style attribute,
           which lets one rule fix ~40 grids without editing each one. */
        [style*="grid-template-columns"] {
          grid-template-columns: 1fr !important;
        }
      }

      // True when the viewport is phone-sized. Used to switch the shell
      // (sidebar/nav/content) between the desktop and mobile layouts.
      function useIsMobile(breakpoint = 768) {
        const [isMobile, setIsMobile] = useState(
          typeof window !== "undefined"
            ? window.innerWidth <= breakpoint
            : false,
        );
        useEffect(() => {
          const onResize = () =>
            setIsMobile(window.innerWidth <= breakpoint);
          window.addEventListener("resize", onResize);
          return () => window.removeEventListener("resize", onResize);
        }, [breakpoint]);
        return isMobile;
      }

      // otherwise falls back to the original static date.
      function getDaysUntil() {
        const fallback = new Date("2025-09-20");
        const weddingDate =
          (window.DataStore &&
            window.DataStore.getMetaDate &&
            window.DataStore.getMetaDate()) ||
          fallback;
        const now = new Date();
        const diff = weddingDate - now;
        return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
      }

        const fallback = new Date("2025-09-20");

        return d.toLocaleDateString(undefined, {

      // Budget component
      function Budget({ budget, setBudget }) {
        const { t } = useContext(LangContext);
        const [newExpense, setNewExpense] = useState({
          name: "",
          category: budget.categories[0]?.id || 1,
          amount: "",
        });
        const [editTotal, setEditTotal] = useState(false);
        const [totalInput, setTotalInput] = useState(budget.total);
        const [editSpentId, setEditSpentId] = useState(null);
        const [spentInput, setSpentInput] = useState("");
        const [editBudgetId, setEditBudgetId] = useState(null);
        const [budgetCatInput, setBudgetCatInput] = useState("");
        const [editNameId, setEditNameId] = useState(null);
        const [nameInput, setNameInput] = useState("");
        const [expandedCat, setExpandedCat] = useState(null);
        const totalSpent = budget.categories.reduce((s, c) => s + c.spent, 0);
        const remaining = budget.total - totalSpent;

        const saveSpent = (catId) => {
          const val = parseFloat(spentInput);
          if (!isNaN(val)) {
            setBudget((b) => ({
              ...b,
              categories: b.categories.map((c) =>
                c.id === catId ? { ...c, spent: val } : c,
              ),
            }));
          }
          setEditSpentId(null);
          setSpentInput("");
        };

        const saveCatName = (catId) => {
          const val = nameInput.trim();
          if (val) {
            setBudget((b) => ({
              ...b,
              categories: b.categories.map((c) =>
                c.id === catId ? { ...c, name: val } : c,
              ),
            }));
          }
          setEditNameId(null);
          setNameInput("");
        };

        const saveCatBudget = (catId) => {
          const val = parseFloat(budgetCatInput);
          if (!isNaN(val) && val >= 0) {
            setBudget((b) => ({
              ...b,
              categories: b.categories.map((c) =>
                c.id === catId ? { ...c, budget: val } : c,
              ),
            }));
          }
          setEditBudgetId(null);
          setBudgetCatInput("");
        };

        const addExpense = () => {
          if (!newExpense.name || !newExpense.amount) return;
          const amt = parseFloat(newExpense.amount);
          if (isNaN(amt)) return;
          const expense = {
            name: newExpense.name,
            amount: amt,
            date: new Date().toLocaleDateString(),
          };
          setBudget((b) => ({
            ...b,
            categories: b.categories.map((c) =>
              c.id === parseInt(newExpense.category)
                ? {
                    ...c,
                    spent: c.spent + amt,
                    expenses: [...(c.expenses || []), expense],
                  }
                : c,
            ),
          }));
          setNewExpense({
            name: "",
            category: newExpense.category,
            amount: "",
          });
        };

        return (
          <div>
            <SectionTitle sub={t("bud_sub")}>{t("bud_title")}</SectionTitle>

            <div
              style={{
                display: "grid",
                gridTemplateColumns: "repeat(3, 1fr)",
                gap: 12,
                marginBottom: 24,
              }}
            >
              {editTotal ? (
                <Card style={{ textAlign: "center", padding: "18px 16px" }}>
                  <div
                    style={{
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 12,
                      color: COLORS.muted,
                      textTransform: "uppercase",
                      letterSpacing: "0.08em",
                      marginBottom: 8,
                      fontWeight: 500,
                    }}
                  >
                    {t("bud_total")}
                  </div>
                  <input
                    value={totalInput}
                    onChange={(e) => setTotalInput(e.target.value)}
                    autoFocus
                    type="number"
                    style={{
                      width: "100%",
                      padding: "4px 8px",
                      border: `1px solid ${COLORS.border}`,
                      borderRadius: 8,
                      fontFamily: "'Cormorant Garamond', serif",
                      fontSize: 28,
                      fontWeight: 500,
                      textAlign: "center",
                      color: COLORS.ink,
                      background: COLORS.white,
                      boxSizing: "border-box",
                    }}
                  />
                  <div
                    style={{
                      display: "flex",
                      gap: 8,
                      justifyContent: "center",
                      marginTop: 10,
                    }}
                  >
                    <button
                      onClick={() => {
                        setBudget((b) => ({
                          ...b,
                          total: parseFloat(totalInput) || b.total,
                        }));
                        setEditTotal(false);
                      }}
                      style={{

      // Venues component
      function Venues({ venues, setVenues }) {
        const { t } = useContext(LangContext);
        const [showTrash, setShowTrash] = useState(false);
        const [showAdd, setShowAdd] = useState(false);
        const [newVenue, setNewVenue] = useState({
          name: "",
          location: "",
          capacity: "",
          price: "",
          style: "",
          rating: "",
          notes: "",
          image: "🏛",
          menu: [],
        });
        const [expandedMenus, setExpandedMenus] = useState({});
        const [addingMenuItem, setAddingMenuItem] = useState({});
        const [newMenuItems, setNewMenuItems] = useState({});
        const [draggedItemId, setDraggedItemId] = useState(null);
        const [dragOverItemId, setDragOverItemId] = useState(null);

        const active = venues.filter((v) => !v.deleted);
        const deleted = venues.filter((v) => v.deleted);

        const selectVenue = (id) =>
          setVenues((vs) => vs.map((v) => ({ ...v, selected: v.id === id })));

        const addVenue = async () => {
          if (!newVenue.name) return;
          const item = {
            ...newVenue,
            capacity: parseInt(newVenue.capacity) || 0,
            price: parseFloat(newVenue.price) || 0,
            rating: parseFloat(newVenue.rating) || 0,
            selected: false,
            deleted: false,
          };
          try {
            const saved = await apiPost("venues", item);
            setVenues((vs) => [...vs, saved]);
            setNewVenue({
              name: "",
              location: "",
              capacity: "",
              price: "",
              style: "",
              rating: "",
              notes: "",
              image: "🏛",
              menu: [],
            });
            setShowAdd(false);
          } catch (e) {
            console.warn("Failed to add venue", e);
          }
        };

        const deleteVenue = async (id) => {
          try {
            await apiPatch("venues", id, { deleted: true });
            setVenues((vs) =>
              vs.map((v) => (v.id === id ? { ...v, deleted: true } : v)),
            );
          } catch (e) {
            console.warn("Failed to delete venue", e);
          }
        };

        const restoreVenue = async (id) => {
          try {
            await apiPatch("venues", id, { deleted: false });
            setVenues((vs) =>
              vs.map((v) => (v.id === id ? { ...v, deleted: false } : v)),
            );
          } catch (e) {
            console.warn("Failed to restore venue", e);
          }
        };

        const toggleMenu = (id) =>
          setExpandedMenus((prev) => ({ ...prev, [id]: !prev[id] }));

        const addMenuItem = async (venueId) => {
          const item = newMenuItems[venueId];
          if (!item?.name) return;
          const menuItem = {
            id: Date.now(),
            course: item.course || "",
            name: item.name,
            description: item.description || "",
          };
          const venue = venues.find((v) => v.id === venueId);
          const updatedMenu = [...(venue.menu || []), menuItem];
          try {
            await apiPatch("venues", venueId, { menu: updatedMenu });
            setVenues((vs) =>
              vs.map((v) =>
                v.id === venueId ? { ...v, menu: updatedMenu } : v,
              ),
            );
            setNewMenuItems((prev) => ({
              ...prev,
              [venueId]: { course: "", name: "", description: "" },
            }));
            setAddingMenuItem((prev) => ({ ...prev, [venueId]: false }));
          } catch (e) {
            console.warn("Failed to add menu item", e);
          }
        };

        const removeMenuItem = async (venueId, itemId) => {
          const venue = venues.find((v) => v.id === venueId);
          const updatedMenu = (venue.menu || []).filter((m) => m.id !== itemId);
          try {
            await apiPatch("venues", venueId, { menu: updatedMenu });
            setVenues((vs) =>
              vs.map((v) =>
                v.id === venueId ? { ...v, menu: updatedMenu } : v,
              ),
            );
          } catch (e) {
            console.warn("Failed to remove menu item", e);
          }
        };

        const inp = {
          width: "100%",
          padding: "7px 10px",
          border: `1px solid ${COLORS.border}`,
          borderRadius: 8,
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 13,
          background: COLORS.white,
          boxSizing: "border-box",
        };

          fontFamily: "'DM Sans', sans-serif",
          fontSize: 11,
          color: COLORS.muted,
          marginBottom: 4,
        };

                  padding: "7px 16px",

                  cursor: "pointer",

                  fontWeight: 500,

              </button>

                count={deleted.length}
                onClick={() => setShowTrash((s) => !s)}
                active={showTrash}
              />
            </div>

              <TrashPanel
                items={deleted}
                onRestore={restoreVenue}
                renderItem={(v) =>
                  `${v.image || "🏛"} ${v.name} · ${v.location}`

              />
            )}

            {showAdd && (

                  border: `1px solid ${COLORS.roseMid}`,

                  </div>
                  <div>

                      }

                      style={inp}
                    />
                  </div>
                  <div>

                    <input

                        setNewVenue((n) => ({ ...n, style: e.target.value }))
                      }
                      placeholder={t("ven_style_ph")}
                      style={inp}
                    />
                  </div>
                  <div>
                    <div style={lbl}>{t("ven_emoji")}</div>
                    <input

                  </div>

                    marginBottom: 10,

                        setNewVenue((n) => ({ ...n, price: e.target.value }))

                      type="number"
                      style={inp}

                  <div>
                    <div style={lbl}>{t("ven_rating")}</div>
                    <input

                menu.forEach((item) => {
                  const c = item.course || "";
                  if (!grouped[c]) { grouped[c] = []; courseOrder.push(c); }
                  grouped[c].push(item);
                });
                return (
                  <Card
                    key={v.id}
                    style={{
                      border: v.selected
                        ? `2px solid ${COLORS.rose}`
                        : `1px solid ${COLORS.border}`,
                      position: "relative",
                    }}
                  >
                    {/* ① Top-right: Selected badge OR Select button */}
                    <div style={{ position: "absolute", top: 16, right: 16, zIndex: 1 }}>
                      {v.selected ? (
                        <Badge>{t("ven_selected")}</Badge>
                      ) : (
                        <button
                          onClick={() => selectVenue(v.id)}
                          style={{
                            padding: "6px 16px",
                            background: "transparent",
                            color: COLORS.rose,
                            border: `1px solid ${COLORS.rose}`,
                            borderRadius: 10,
                            cursor: "pointer",
                            fontFamily: "'DM Sans', sans-serif",
                            fontSize: 13,

                      <div style={{ flex: 1, minWidth: 0 }}>
                        {/* Name + location — leave room for top-right button */}
                        <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 4, paddingRight: 160 }}>
                          <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 26, fontWeight: 500, color: COLORS.ink, margin: 0 }}>
                            {v.name}
                          </h3>
                          <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: COLORS.muted }}>
                            {v.location}
                          </span>
                        </div>

                        {/* Badges */}
                        <div style={{ display: "flex", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
                          <Badge color={COLORS.brown} bg={COLORS.champagne}>{v.style}</Badge>
                          <Badge color={COLORS.sage} bg={COLORS.sageLight}>{t("ven_up_to", { n: v.capacity })}</Badge>

                                        if (!draggedItemId) return;
                                        const cur = [...(v.menu || [])];
                                        const fi = cur.findIndex((m) => m.id === draggedItemId);
                                        if (fi === -1) return;
                                        const [moved] = cur.splice(fi, 1);
                                        moved.course = courseName;
                                        const last = cur.reduce((acc, m, i) => (m.course || "") === courseName ? i : acc, -1);
                                        cur.splice(last + 1, 0, moved);
                                        apiPatch("venues", v.id, { menu: cur })
                                          .then(() => setVenues((vs) => vs.map((vn) => vn.id === v.id ? { ...vn, menu: cur } : vn)))
                                          .catch(console.warn);
                                        setDraggedItemId(null);
                                        setDragOverItemId(null);
                                      }}
                                      style={{ marginBottom: 10 }}
                                    >
                                      {/* Course heading */}

                                        <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, fontWeight: 700, color: COLORS.rose, textTransform: "uppercase", letterSpacing: "0.08em", padding: "3px 4px 5px", borderBottom: `1px solid ${COLORS.roseLight}`, marginBottom: 4 }}>
                                          {courseName}
                                        </div>
                                      )}
                                      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                                        {grouped[courseName].map((item) => (
                                          <div
                                            key={item.id}
                                            draggable
                                            onDragStart={(e) => { setDraggedItemId(item.id); e.dataTransfer.effectAllowed = "move"; }}
                                            onDragEnd={() => { setDraggedItemId(null); setDragOverItemId(null); }}
                                            onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setDragOverItemId(item.id); }}
                                            onDragLeave={() => setDragOverItemId(null)}
                                            onDrop={(e) => {
                                              e.preventDefault();
                                              e.stopPropagation();
                                              if (!draggedItemId || draggedItemId === item.id) return;
                                              const cur = [...(v.menu || [])];
                                              const fi = cur.findIndex((m) => m.id === draggedItemId);
                                              if (fi === -1) return;
                                              const [moved] = cur.splice(fi, 1);
                                              moved.course = item.course;
                                              const ti = cur.findIndex((m) => m.id === item.id);
                                              cur.splice(ti, 0, moved);
                                              apiPatch("venues", v.id, { menu: cur })
                                                .then(() => setVenues((vs) => vs.map((vn) => vn.id === v.id ? { ...vn, menu: cur } : vn)))
                                                .catch(console.warn);
                                              setDraggedItemId(null);
                                              setDragOverItemId(null);
                                            }}
                                            style={{
                                              display: "flex",
                                              justifyContent: "space-between",
                                              alignItems: "flex-start",
                                              padding: "7px 10px",
                                              background: COLORS.bg,
                                              borderRadius: 8,
                                              border: dragOverItemId === item.id ? `2px solid ${COLORS.rose}` : `1px solid ${COLORS.border}`,
                                              opacity: draggedItemId === item.id ? 0.4 : 1,
                                              cursor: "grab",
                                              transition: "border 0.1s, opacity 0.15s",

                                            <div style={{ display: "flex", alignItems: "center", gap: 8, flex: 1, minWidth: 0 }}>
                                              <span style={{ color: COLORS.border, fontSize: 14, flexShrink: 0, userSelect: "none" }}>⠿</span>
                                              <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: COLORS.ink, fontWeight: 500 }}>
                                                {item.name}
                                              </span>
                                            </div>
                                            {/* ⑥ Right: description wraps + remove button */}
                                            <div style={{ display: "flex", alignItems: "flex-start", gap: 8, maxWidth: "45%" }}>
                                              {item.description && (
                                                <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: COLORS.muted, textAlign: "right", whiteSpace: "normal", wordBreak: "break-word" }}>
                                                  {item.description}
                                                </span>
                                              )}
                                              <button
                                                onClick={() => removeMenuItem(v.id, item.id)}
                                                title={t("ven_menu_remove")}
                                                style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.muted, fontSize: 14, padding: 0, flexShrink: 0, lineHeight: 1 }}
                                              >
                                                ✕
                                              </button>
                                            </div>
                                          </div>
                                        ))}
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              )}

                              {addingMenuItem[v.id] ? (
                                <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr 2fr auto", gap: 6, alignItems: "end" }}>
                                  <div>
                                    <div style={lbl}>{t("ven_menu_course")}</div>
                                    <input
                                      value={newMenuItems[v.id]?.course || ""}
                                      onChange={(e) => setNewMenuItems((prev) => ({ ...prev, [v.id]: { ...(prev[v.id] || {}), course: e.target.value } }))}
                                      placeholder={t("ven_menu_course_ph")}
                                      style={inp}
                                    />
                                  </div>
                                  <div>
                                    <div style={lbl}>{t("ven_menu_dish")}</div>
                                    <input
                                      value={newMenuItems[v.id]?.name || ""}
                                      onChange={(e) => setNewMenuItems((prev) => ({ ...prev, [v.id]: { ...(prev[v.id] || {}), name: e.target.value } }))}
                                      placeholder={t("ven_menu_dish_ph")}
                                      style={inp}
                                    />
                                  </div>
                                  <div>
                                    <div style={lbl}>{t("ven_menu_desc")}</div>
                                    <input
                                      value={newMenuItems[v.id]?.description || ""}
                                      onChange={(e) => setNewMenuItems((prev) => ({ ...prev, [v.id]: { ...(prev[v.id] || {}), description: e.target.value } }))}
                                      placeholder={t("ven_menu_desc_ph")}
                                      style={inp}
                                    />
                                  </div>
                                  <div style={{ display: "flex", gap: 4 }}>
                                    <button
                                      onClick={() => addMenuItem(v.id)}
                                      style={{ padding: "7px 12px", background: COLORS.rose, color: "#fff", border: "none", borderRadius: 8, cursor: "pointer", fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 500, whiteSpace: "nowrap" }}
                                    >
                                      {t("add")}
                                    </button>
                                    <button
                                      onClick={() => setAddingMenuItem((prev) => ({ ...prev, [v.id]: false }))}
                                      style={{ padding: "7px 10px", background: "transparent", color: COLORS.muted, border: `1px solid ${COLORS.border}`, borderRadius: 8, cursor: "pointer", fontFamily: "'DM Sans', sans-serif", fontSize: 13 }}
                                    >
                                      {t("cancel")}
                                    </button>
                                  </div>
                                </div>
                              ) : (
                                <button
                                  onClick={() => setAddingMenuItem((prev) => ({ ...prev, [v.id]: true }))}
                                  style={{ padding: "5px 12px", background: "transparent", color: COLORS.rose, border: `1px dashed ${COLORS.roseMid}`, borderRadius: 8, cursor: "pointer", fontFamily: "'DM Sans', sans-serif", fontSize: 12, fontWeight: 500 }}
                                >
                                  {t("ven_menu_add")}
                                </button>
                              )}
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  </Card>
                );
              })}
            </div>
          </div>
        );
      }

      // Photographers component
      function Photographers({ photographers, setPhotographers }) {
        const { t } = useContext(LangContext);
        const [showTrash, setShowTrash] = useState(false);
        const [showAdd, setShowAdd] = useState(false);
        const [newPhoto, setNewPhoto] = useState({
          name: "",
          style: "",
          price: "",
          hours: "",
          rating: "",
          specialties: "",
          image: "📷",
        });

        const active = photographers.filter((p) => !p.deleted);
        const deleted = photographers.filter((p) => p.deleted);

        const select = (id) =>
          setPhotographers((ps) =>
            ps.map((p) => ({ ...p, selected: p.id === id })),
          );

        const addPhotographer = async () => {
          if (!newPhoto.name) return;
          const item = {
            name: newPhoto.name,
            style: newPhoto.style,
            price: parseFloat(newPhoto.price) || 0,
            hours: parseInt(newPhoto.hours) || 0,
            rating: parseFloat(newPhoto.rating) || 0,
            specialties: newPhoto.specialties
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean),
            image: newPhoto.image || "📷",
            selected: false,
            deleted: false,
          };
          try {
            const saved = await apiPost("photographers", item);
            setPhotographers((ps) => [...ps, saved]);
            setNewPhoto({
              name: "",
              style: "",
              price: "",
              hours: "",
              rating: "",
              specialties: "",
              image: "📷",
            });
            setShowAdd(false);
          } catch (e) {
            console.warn("Failed to add photographer", e);
          }
        };

        const deletePhotographer = async (id) => {
          try {
            await apiPatch("photographers", id, { deleted: true });
            setPhotographers((ps) =>
              ps.map((p) => (p.id === id ? { ...p, deleted: true } : p)),
            );
          } catch (e) {
            console.warn("Failed to delete photographer", e);
          }
        };

        const restorePhotographer = async (id) => {
          try {
            await apiPatch("photographers", id, { deleted: false });
            setPhotographers((ps) =>
              ps.map((p) => (p.id === id ? { ...p, deleted: false } : p)),
            );
          } catch (e) {
            console.warn("Failed to restore photographer", e);
          }

          width: "100%",
          padding: "7px 10px",
          border: `1px solid ${COLORS.border}`,
          borderRadius: 8,
          fontFamily: "'DM Sans', sans-serif",
          fontSize: 13,
          background: COLORS.white,
          boxSizing: "border-box",

          fontFamily: "'DM Sans', sans-serif",
          fontSize: 11,
          color: COLORS.muted,
          marginBottom: 4,

                style={{
                  padding: "7px 16px",
                  background: showAdd ? COLORS.roseLight : COLORS.rose,
                  color: showAdd ? COLORS.rose : "#fff",
                  border: `1px solid ${COLORS.rose}`,
                  borderRadius: 8,
                  cursor: "pointer",
                  fontFamily: "'DM Sans', sans-serif",
                  fontSize: 13,
                  fontWeight: 500,
                }}
              >
                {t("pho_add")}
              </button>
              <TrashButton
                count={deleted.length}
                onClick={() => setShowTrash((s) => !s)}
                active={showTrash}
              />
            </div>

            {showTrash && (
              <TrashPanel
                items={deleted}
                onRestore={restorePhotographer}
                renderItem={(p) => `${p.image || "📷"} ${p.name} · ${p.style}`}
              />
            )}

            {showAdd && (
              <Card
                style={{
                  marginBottom: 16,
                  background: COLORS.roseLight,
                  border: `1px solid ${COLORS.roseMid}`,
                }}
              >
                <div
                  style={{
                    fontFamily: "'DM Sans', sans-serif",
                    fontSize: 12,
                    textTransform: "uppercase",
                    color: COLORS.rose,
                    marginBottom: 14,
                    fontWeight: 600,
                  }}
                >
                  {t("pho_new")}
                </div>
                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "2fr 1fr 1fr 1fr",
                    gap: 10,
                    marginBottom: 10,
                  }}
                >
                  <div>
                    <div style={lbl}>{t("pho_name")}</div>
                    <input
                      value={newPhoto.name}
                      onChange={(e) =>
                        setNewPhoto((n) => ({ ...n, name: e.target.value }))
                      }
                      placeholder={t("pho_name_ph")}
                      style={inp}
                    />
                  </div>
                  <div>
                    <div style={lbl}>{t("pho_style")}</div>
                    <input
                      value={newPhoto.style}
                      onChange={(e) =>
                        setNewPhoto((n) => ({ ...n, style: e.target.value }))
                      }
                      placeholder={t("pho_style_ph")}
                      style={inp}
                    />
                  </div>
                  <div>
                    <div style={lbl}>{t("pho_price")}</div>
                    <input
                      value={newPhoto.price}
                      onChange={(e) =>
                        setNewPhoto((n) => ({ ...n, price: e.target.value }))
                      }
                      placeholder="0"
                      type="number"
                      style={inp}
                    />
                  </div>
                  <div>
                    <div style={lbl}>{t("ven_emoji")}</div>
                    <input
                      value={newPhoto.image}
                      onChange={(e) =>
                        setNewPhoto((n) => ({ ...n, image: e.target.value }))
                      }
                      placeholder="📷"
                      style={{ ...inp, fontSize: 20 }}

                  </div>
                </div>
                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "1fr 1fr 2fr auto",
                    gap: 10,
                    alignItems: "end",
                  }}
                >
                  <div>
                    <div style={lbl}>{t("pho_hours")}</div>
                    <input
                      value={newPhoto.hours}
                      onChange={(e) =>
                        setNewPhoto((n) => ({ ...n, hours: e.target.value }))
                      }
                      placeholder={t("pho_hours_ph")}
                      type="number"
                      style={inp}
                    />
                  </div>
                  <div>
                    <div style={lbl}>{t("pho_rating")}</div>
                    <input
                      value={newPhoto.rating}
                      onChange={(e) =>
                        setNewPhoto((n) => ({ ...n, rating: e.target.value }))
                      }
                      placeholder="0.0"
                      type="number"
                      step="0.1"
                      style={inp}
                    />
                  </div>
                  <div>
                    <div style={lbl}>{t("pho_specialties")}</div>
                    <input
                      value={newPhoto.specialties}
                      onChange={(e) =>
                        setNewPhoto((n) => ({
                          ...n,
                          specialties: e.target.value,
                        }))
                      }
                      placeholder={t("pho_specialties_ph")}
                      style={inp}
                    />
                  </div>
                  <button
                    onClick={addPhotographer}
                    style={{
                      padding: "7px 20px",
                      background: COLORS.rose,
                      color: "#fff",
                      border: "none",
                      borderRadius: 8,
                      cursor: "pointer",
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 13,
                      fontWeight: 500,
                      whiteSpace: "nowrap",
                    }}
                  >
                    {t("pho_save")}
                  </button>
                </div>
              </Card>
            )}

            <div
              style={{
                display: "grid",
                gridTemplateColumns: "1fr 1fr 1fr",
                gap: 16,
              }}
            >
              {active.map((p) => (
                <Card
                  key={p.id}
                  style={{
                    border: p.selected
                      ? `2px solid ${COLORS.rose}`
                      : `1px solid ${COLORS.border}`,
                    position: "relative",
                  }}
                >
                  {p.selected && (
                    <div style={{ position: "absolute", top: 12, right: 12 }}>
                      <Badge>{t("pho_chosen")}</Badge>
                    </div>
                  )}
                  <div style={{ textAlign: "center", marginBottom: 12 }}>
                    <div style={{ fontSize: 40, marginBottom: 8 }}>
                      {p.image}
                    </div>
                    <h3
                      style={{
                        fontFamily: "'Cormorant Garamond', serif",
                        fontSize: 22,
                        fontWeight: 500,
                        color: COLORS.ink,
                        margin: "0 0 4px",
                      }}
                    >
                      {p.name}
                    </h3>
                    <div
                      style={{
                        fontFamily: "'DM Sans', sans-serif",
                        fontSize: 13,
                        color: COLORS.muted,
                      }}
                    >
                      {p.style}
                    </div>
                  </div>
                  <div
                    style={{
                      borderTop: `1px solid ${COLORS.border}`,
                      paddingTop: 12,
                      marginBottom: 12,
                    }}
                  >
                    <div
                      style={{
                        display: "flex",
                        justifyContent: "space-between",
                        marginBottom: 6,
                      }}
                    >
                      <span
                        style={{
                          fontFamily: "'DM Sans', sans-serif",
                          fontSize: 13,
                          color: COLORS.muted,
                        }}
                      >
                        {t("pho_package")}
                      </span>
                      <span
                        style={{
                          fontFamily: "'DM Sans', sans-serif",
                          fontSize: 13,
                          fontWeight: 500,
                          color: COLORS.ink,
                        }}
                      >
                        ${p.price.toLocaleString()}
                      </span>
                    </div>
                    <div
                      style={{
                        display: "flex",
                        justifyContent: "space-between",
                        marginBottom: 6,
                      }}
                    >
                      <span
                        style={{
                          fontFamily: "'DM Sans', sans-serif",
                          fontSize: 13,
                          color: COLORS.muted,
                        }}
                      >
                        {t("pho_hours")}
                      </span>
                      <span
                        style={{
                          fontFamily: "'DM Sans', sans-serif",
                          fontSize: 13,
                          fontWeight: 500,
                          color: COLORS.ink,
                        }}
                      >

      // Guests component
      function Guests({ guests, setGuests }) {
        const { t } = useContext(LangContext);
        const [filter, setFilter] = useState("all");
        const [search, setSearch] = useState("");
        const [showAdd, setShowAdd] = useState(false);
        const [showTrash, setShowTrash] = useState(false);
        const [newGuest, setNewGuest] = useState({
          name: "",
          count: 1,
          group: "Friend",
          rsvp: "pending",
          dietary: "None",
        });

        const activeGuests = guests.filter((g) => !g.deleted);
        const deletedGuests = guests.filter((g) => g.deleted);

        const filtered = activeGuests.filter((g) => {
          const matchFilter = filter === "all" || g.rsvp === filter;
          const matchSearch = g.name
            .toLowerCase()
            .includes(search.toLowerCase());
          return matchFilter && matchSearch;
        });

        const addGuest = () => {
          if (!newGuest.name) return;
          const count = Math.max(1, parseInt(newGuest.count, 10) || 1);
          setGuests((gs) => [
            ...gs,
            { ...newGuest, count, id: Date.now(), table: null, deleted: false },
          ]);
          setNewGuest({
            name: "",
            count: 1,
            group: "Friend",
            rsvp: "pending",
            dietary: "None",
          });
          setShowAdd(false);
        };

        const deleteGuest = async (id) => {
          try {
            await apiPatch("guests", id, { deleted: true });
            setGuests((gs) =>
              gs.map((g) => (g.id === id ? { ...g, deleted: true } : g)),
            );
          } catch (e) {
            console.warn("Failed to delete guest", e);
          }
        };

        const restoreGuest = async (id) => {
          try {
            await apiPatch("guests", id, { deleted: false });
            setGuests((gs) =>
              gs.map((g) => (g.id === id ? { ...g, deleted: false } : g)),
            );
          } catch (e) {
            console.warn("Failed to restore guest", e);
          }
        };

        const updateRsvp = (id, rsvp) =>
          setGuests((gs) => gs.map((g) => (g.id === id ? { ...g, rsvp } : g)));

        const confirmed = activeGuests.filter(
          (g) => g.rsvp === "confirmed",

        const pending = activeGuests.filter((g) => g.rsvp === "pending").length;
        const declined = activeGuests.filter(

          pending: { color: COLORS.gold, bg: COLORS.goldLight },

            {showTrash && (

                accent={COLORS.ink}

                label={t("gue_confirmed")}
                value={confirmed}
                accent={COLORS.sage}
              />
              <StatCard
                label={t("gue_pending")}
                value={pending}
                accent={COLORS.gold}
              />
              <StatCard
                label={t("gue_declined")}
                value={declined}
                accent={COLORS.rose}
              />
            </div>

                  borderRadius: 10,

                  background: COLORS.white,

                    style={{

                      border: `1px solid ${COLORS.border}`,
                      borderRadius: 8,
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 13,
                      background: COLORS.white,
                    }}
                  />
                  <select
                    value={newGuest.group}
                    onChange={(e) =>
                      setNewGuest((g) => ({ ...g, group: e.target.value }))
                    }
                    style={{
                      padding: "7px 12px",
                      border: `1px solid ${COLORS.border}`,
                      borderRadius: 8,
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 13,
                      background: COLORS.white,
                    }}
                  >
                    <option value="Family">{t("grp_family")}</option>
                    <option value="Friend">{t("grp_friend")}</option>

                      {t("grp_partners_friend")}

                  </select>
                  <select

                    onChange={(e) =>
                      setNewGuest((g) => ({ ...g, dietary: e.target.value }))

                    style={{
                      padding: "7px 12px",
                      border: `1px solid ${COLORS.border}`,
                      borderRadius: 8,
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 13,
                      background: COLORS.white,
                    }}
                  >
                    <option value="None">{t("diet_none")}</option>
                    <option value="Vegetarian">{t("diet_vegetarian")}</option>

                  <button

                      border: "none",
                      borderRadius: 8,
                      cursor: "pointer",
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 13,
                    }}

                    {t("add")}
                  </button>
                </div>
              </Card>
            )}

            <Card style={{ padding: 0, overflow: "hidden" }}>
              <table style={{ width: "100%", borderCollapse: "collapse" }}>
                <thead>
                  <tr style={{ background: COLORS.champagne }}>
                    {[
                      t("gue_col_name"),
                      t("gue_col_count"),
                      t("gue_col_group"),

                      t("gue_col_dietary"),
                      t("gue_col_table"),

                    ].map((h) => (
                      <th

                          borderBottom: `1px solid ${COLORS.border}`,
                        }}
                      >
                        {h}

                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((g, i) => (
                    <tr
                      key={g.id}
                      style={{
                        background: i % 2 === 0 ? COLORS.white : COLORS.bg,
                        transition: "background 0.15s",
                      }}

                      <td

                      <td
                        style={{

                        }}

                        ×{g.count || 1}
                      </td>

                          {g.group}
                        </Badge>
                      </td>
                      <td style={{ padding: "10px 16px" }}>
                        <select
                          value={g.rsvp}
                          onChange={(e) => updateRsvp(g.id, e.target.value)}
                          style={{

                            fontFamily: "'DM Sans', sans-serif",

                            g.dietary !== "None" ? COLORS.sage : COLORS.muted,
                        }}

                        {g.dietary}
                      </td>
                      <td
                        style={{
                          padding: "10px 16px",
                          fontFamily: "'DM Sans', sans-serif",

                          color: g.table ? COLORS.ink : COLORS.muted,
                        }}
                      >
                        {g.table ? `Table ${g.table}` : "—"}

                    color: COLORS.muted,
                  }}
                >
                  {t("gue_not_found")}
                </div>
              )}
            </Card>
          </div>
        );

      // Tables component
      function Tables({ guests, setGuests, tables, setTables }) {
        const { t } = useContext(LangContext);
        const [newTable, setNewTable] = useState({ name: "", capacity: 8 });
        const [assignGuest, setAssignGuest] = useState({
          guestId: "",
          tableId: "",
        });

        const unassigned = guests.filter(
          (g) => !g.table && g.rsvp !== "declined",
        );

        const assignToTable = () => {
          if (!assignGuest.guestId || !assignGuest.tableId) return;
          setGuests((gs) =>
            gs.map((g) =>
              g.id === parseInt(assignGuest.guestId)
                ? { ...g, table: parseInt(assignGuest.tableId) }
                : g,
            ),
          );
          setAssignGuest({ guestId: "", tableId: "" });
        };

        const removeFromTable = (guestId) =>
          setGuests((gs) =>
            gs.map((g) => (g.id === guestId ? { ...g, table: null } : g)),
          );

        const addTable = () => {
          if (!newTable.name) return;
          setTables((ts) => [
            ...ts,
            {
              id: Date.now(),
              name: newTable.name,
              capacity: parseInt(newTable.capacity) || 8,
              shape: "round",
            },
          ]);
          setNewTable({ name: "", capacity: 8 });
        };

        const deleteTable = (tableId) => {
          setTables((ts) => ts.filter((t) => t.id !== tableId));
          setGuests((gs) =>
            gs.map((g) => (g.table === tableId ? { ...g, table: null } : g)),
          );
        };

        return (
          <div>
            <SectionTitle sub={t("tbl_sub")}>{t("tbl_title")}</SectionTitle>

            <div
              style={{
                display: "grid",
                gridTemplateColumns: "1fr 1fr",
                gap: 16,
                marginBottom: 16,
              }}
            >
              <Card
                style={{
                  background: COLORS.champagne,
                  border: `1px solid ${COLORS.champagneDark}`,
                }}
              >
                <div
                  style={{
                    fontFamily: "'DM Sans', sans-serif",
                    fontSize: 12,
                    textTransform: "uppercase",
                    letterSpacing: "0.06em",
                    color: COLORS.muted,
                    marginBottom: 12,
                    fontWeight: 500,
                  }}
                >
                  {t("tbl_assign_title")}
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <select
                    value={assignGuest.guestId}
                    onChange={(e) =>
                      setAssignGuest((a) => ({ ...a, guestId: e.target.value }))
                    }
                    style={{
                      flex: 1,
                      padding: "8px 12px",
                      border: `1px solid ${COLORS.border}`,
                      borderRadius: 8,
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 13,
                      background: COLORS.white,
                    }}
                  >
                    <option value="">{t("tbl_guest_ph")}</option>
                    {unassigned.map((g) => (
                      <option key={g.id} value={g.id}>
                        {g.name} (×{g.count || 1})
                      </option>
                    ))}
                  </select>
                  <select
                    value={assignGuest.tableId}
                    onChange={(e) =>
                      setAssignGuest((a) => ({ ...a, tableId: e.target.value }))
                    }
                    style={{
                      flex: 1,
                      padding: "8px 12px",
                      border: `1px solid ${COLORS.border}`,
                      borderRadius: 8,
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 13,
                      background: COLORS.white,
                    }}
                  >
                    <option value="">{t("tbl_table_ph")}</option>
                    {tables.map((t) => (
                      <option key={t.id} value={t.id}>
                        {t.name}
                      </option>
                    ))}
                  </select>
                  <button
                    onClick={assignToTable}
                    style={{
                      padding: "8px 16px",
                      background: COLORS.rose,
                      color: "#fff",
                      border: "none",
                      borderRadius: 8,
                      cursor: "pointer",
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 13,
                    }}

                    {t("tbl_assign")}

                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 12,

                  />

                    value={newTable.capacity}
                    onChange={(e) =>
                      setNewTable((tbl) => ({

                        capacity: e.target.value,

                    placeholder={t("tbl_seats")}
                    style={{
                      flex: 1,
                      padding: "8px 12px",
                      border: `1px solid ${COLORS.border}`,

                  <Card
                    key={tbl.id}

                  >

                      style={{
                        display: "flex",
                        justifyContent: "space-between",
                        alignItems: "center",
                        marginBottom: 12,

                    >

                          fontFamily: "'Cormorant Garamond', serif",

                          fontWeight: 500,

                          margin: 0,

                      >

                      <div
                        style={{

      // Checklist component
      function Checklist({
        checklist,
        setChecklist,
        checklistCategories,
        setChecklistCategories,
      }) {
        const { t } = useContext(LangContext);
        const [newTask, setNewTask] = useState({
          task: "",
          category: checklistCategories[0] || "Planning",
          priority: "medium",
        });
        const [filterCat, setFilterCat] = useState("all");
        const [showTrash, setShowTrash] = useState(false);
        const [showAddCat, setShowAddCat] = useState(false);
        const [newCatName, setNewCatName] = useState("");

        const activeChecklist = checklist.filter((item) => !item.deleted);
        const deletedTasks = checklist.filter((item) => item.deleted);

        // Merge saved categories with any categories found in existing tasks (for backward compat)
        const taskCats = [
          ...new Set(activeChecklist.map((item) => item.category)),
        ];
        const categories = [
          ...new Set([...(checklistCategories || []), ...taskCats]),
        ];

        const addCategory = () => {
          const name = newCatName.trim();
          if (!name || categories.includes(name)) {
            setNewCatName("");
            setShowAddCat(false);
            return;
          }
          setChecklistCategories([...(checklistCategories || []), name]);
          setNewCatName("");
          setShowAddCat(false);
        };

        const deleteCategory = (name) => {
          const inUse = activeChecklist.some((item) => item.category === name);
          if (inUse) return;
          setChecklistCategories(
            (checklistCategories || []).filter((c) => c !== name),
          );
          if (filterCat === name) setFilterCat("all");
        };

        const toggle = (id) =>
          setChecklist((cl) =>
            cl.map((item) =>
              item.id === id ? { ...item, done: !item.done } : item,
            ),
          );

        const deleteTask = (id) => {
          setChecklist((cl) =>
            cl.map((item) =>
              item.id === id ? { ...item, deleted: true } : item,
            ),
          );
        };

        const restoreTask = (id) => {
          setChecklist((cl) =>
            cl.map((item) =>
              item.id === id ? { ...item, deleted: false } : item,
            ),
          );
        };

        const addTask = () => {
          if (!newTask.task) return;
          setChecklist((cl) => [
            ...cl,
            {
              ...newTask,
              id: Date.now(),
              done: false,
              dueMonths: 3,
              deleted: false,
            },
          ]);
          setNewTask({
            task: "",
            category: newTask.category,
            priority: "medium",
          });
        };

        const filtered = activeChecklist.filter(
          (item) => filterCat === "all" || item.category === filterCat,
        );
        const done = activeChecklist.filter((item) => item.done).length;

        const priorityColors = {
          high: { color: "#B05050", bg: "#FAE8E8" },
          medium: { color: COLORS.gold, bg: COLORS.goldLight },
          low: { color: COLORS.sage, bg: COLORS.sageLight },
        };

        return (
          <div>
            <SectionTitle sub={t("chk_sub")}>{t("chk_title")}</SectionTitle>
            <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
              <TrashButton
                count={deletedTasks.length}
                onClick={() => setShowTrash((s) => !s)}
                active={showTrash}
              />
            </div>
            {showTrash && (
              <TrashPanel
                items={deletedTasks}
                onRestore={restoreTask}
                renderItem={(item) => `${item.task} · ${item.category}`}
              />
            )}

            <div
              style={{
                display: "grid",
                gridTemplateColumns: "repeat(3, 1fr)",
                gap: 12,
                marginBottom: 24,
              }}
            >
              <StatCard
                label={t("chk_completed")}
                value={done}
                sub={t("chk_of_tasks", { n: activeChecklist.length })}
                accent={COLORS.sage}
              />
              <StatCard
                label={t("chk_remaining")}
                value={activeChecklist.length - done}
                accent={COLORS.rose}
              />
              <StatCard
                label={t("chk_progress")}
                value={`${Math.round((done / Math.max(1, activeChecklist.length)) * 100)}%`}
                accent={COLORS.gold}
              />
            </div>

            <div
              style={{
                display: "flex",
                gap: 8,
                marginBottom: 16,
                flexWrap: "wrap",
                alignItems: "center",
              }}
            >
              {["all", ...categories].map((cat) => {
                const taskCount =
                  cat === "all"
                    ? 0
                    : activeChecklist.filter((item) => item.category === cat)
                        .length;
                const canDelete = cat !== "all" && taskCount === 0;
                return (
                  <div
                    key={cat}
                    style={{ display: "flex", alignItems: "stretch", gap: 0 }}
                  >
                    <button
                      onClick={() => setFilterCat(cat)}
                      style={{
                        padding: canDelete ? "5px 8px 5px 12px" : "5px 12px",
                        background:
                          filterCat === cat ? COLORS.rose : "transparent",
                        color: filterCat === cat ? "#fff" : COLORS.muted,
                        border: `1px solid ${filterCat === cat ? COLORS.rose : COLORS.border}`,
                        borderRadius: canDelete ? "20px 0 0 20px" : 20,
                        cursor: "pointer",
                        fontFamily: "'DM Sans', sans-serif",
                        fontSize: 12,
                        textTransform: "capitalize",
                      }}
                    >
                      {cat === "all" ? t("chk_filter_all") : cat}
                    </button>
                    {canDelete && (
                      <button
                        onClick={() => deleteCategory(cat)}
                        title={t("chk_del_cat")}
                        style={{
                          padding: "0 8px",
                          background:
                            filterCat === cat ? COLORS.rose : "transparent",
                          color: filterCat === cat ? "#fff" : COLORS.muted,
                          border: `1px solid ${filterCat === cat ? COLORS.rose : COLORS.border}`,
                          borderLeft: "none",

                          fontSize: 12,
                          display: "flex",

                      if (e.key === "Enter") addCategory();
                      if (e.key === "Escape") {

                        setNewCatName("");

                      background: COLORS.white,

                  <button

                      padding: "4px 10px",
                      background: COLORS.rose,
                      color: "#fff",
                      border: "none",
                      borderRadius: 20,
                      cursor: "pointer",
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 12,

                    ✓

                    onClick={() => {
                      setShowAddCat(false);
                      setNewCatName("");

                      color: COLORS.muted,
                      border: `1px solid ${COLORS.border}`,
                      borderRadius: 20,
                      cursor: "pointer",
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 12,
                    }}
                  >
                    ✕
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setShowAddCat(true)}

                    padding: "5px 12px",
                    background: "transparent",
                    color: COLORS.rose,
                    border: `1px dashed ${COLORS.roseMid}`,
                    borderRadius: 20,
                    cursor: "pointer",
                    fontFamily: "'DM Sans', sans-serif",
                    fontSize: 12,
                    fontWeight: 500,
                  }}
                >
                  {t("chk_add_cat")}
                </button>
              )}
            </div>

            <Card
              style={{
                marginBottom: 16,
                background: COLORS.roseLight,
                border: `1px solid ${COLORS.roseMid}`,
                padding: "14px 18px",
              }}
            >
              <div

                <input
                  value={newTask.task}

                <select

                  <option value="high">{t("chk_high")}</option>
                  <option value="medium">{t("chk_medium")}</option>
                  <option value="low">{t("chk_low")}</option>

                <button

                    padding: "7px 16px",

                    borderRadius: 8,
                    cursor: "pointer",
                    fontFamily: "'DM Sans', sans-serif",
                    fontSize: 13,

                  {t("chk_add")}

            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>

                    onChange={() => toggle(task.id)}

                      style={{
                        fontFamily: "'DM Sans', sans-serif",
                        fontSize: 14,

                      {task.task}

                  </div>
                  <Badge
                    color={priorityColors[task.priority].color}
                    bg={priorityColors[task.priority].bg}
                  >
                    {{
                      high: t("chk_high"),
                      medium: t("chk_medium"),
                      low: t("chk_low"),
                    }[task.priority] || task.priority}
                  </Badge>
                  <Badge color={COLORS.brown} bg={COLORS.champagne}>

                  <button

                      flexShrink: 0,

                  >
                    🗑
                  </button>
                </Card>
              ))}
            </div>
          </div>
        );
      }

          if (!newVendor.name) return;
          try {
            const item = {
              ...newVendor,
              price: parseFloat(newVendor.price) || 0,
            };
            const saved = await apiPost("vendors", item);
            setVendors((vs) => [...vs, saved]);
          } catch (e) {
            console.error("addVendor failed", e);

          setNewVendor({
            type: "Florist",
            name: "",
            contact: "",
            phone: "",
            price: "",
            notes: "",

          setShowAdd(false);

        const deleteVendor = async (id) => {
          try {
            await apiPatch("vendors", id, { deleted: true });
            setVendors((vs) =>
              vs.map((v) =>
                String(v.id) === String(id) ? { ...v, deleted: true } : v,
              ),
            );
          } catch (e) {
            console.error("deleteVendor failed", e);
          }

              vs.map((v) =>
                String(v.id) === String(id) ? { ...v, deleted: false } : v,

      function normalizeTl(tl) {
        if (!tl) return DEFAULT_TIMELINE;
        // Strip legacy startTime/endTime/slotHeight from settings
        const rawSettings = tl.settings || {};
        const settings = { interval: rawSettings.interval || 60 };
        // Old single-events format
        if (tl.events && !tl.days) {
          return {
            settings,
            days: [
              { id: "day1", name: "Wedding Day", date: "", events: tl.events },
            ],
          };
        }
        if (!tl.days || tl.days.length === 0) {
          return {
            settings,
            days: [{ id: "day1", name: "Wedding Day", date: "", events: [] }],
          };
        }
        return { ...tl, settings };

      function Timeline({ timeline, setTimeline }) {
        const { t } = useContext(LangContext);
        const [modalState, setModalState] = useState(null);
        const [dayModal, setDayModal] = useState(null);
        const [activeDayId, setActiveDayId] = useState(null);

        const SLOT_HEIGHT = 40;
        const INTERVALS = [15, 30, 60];

        const tl = normalizeTl(timeline);
        const settings = tl.settings || { interval: 60 };
        const days = tl.days || DEFAULT_TIMELINE.days;
        const interval = settings.interval || 60;

        const activeDay = days.find((d) => d.id === activeDayId) || days[0];
        const events = activeDay ? activeDay.events || [] : [];

        const parseTime = (ts) => {
          const parts = (ts || "00:00").split(":");
          return parseInt(parts[0], 10) * 60 + parseInt(parts[1] || 0, 10);
        };

        const formatTime = (minutes) => {
          const h = Math.floor(minutes / 60) % 24;
          const m = minutes % 60;
          return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
        };

        // Auto-range: 2h before first event start, 2h after last event end
        const calcRange = () => {
          if (events.length === 0) return { startMin: 8 * 60, endMin: 22 * 60 };
          let minStart = Infinity,
            maxEnd = -Infinity;
          events.forEach((ev) => {
            const s = parseTime(ev.startTime);
            const e = s + (ev.duration || 60);
            if (s < minStart) minStart = s;
            if (e > maxEnd) maxEnd = e;
          });
          const start = Math.max(
            0,
            Math.floor((minStart - 120) / interval) * interval,
          );
          const end = Math.min(
            24 * 60 - interval,
            Math.ceil((maxEnd + 120) / interval) * interval,
          );
          return { startMin: start, endMin: end };
        };

        const { startMin, endMin } = calcRange();
        const slots = Math.ceil((endMin - startMin) / interval);

        const timeSlots = [];
        for (let i = 0; i <= slots; i++) {
          const min = startMin + i * interval;
          if (min <= endMin) timeSlots.push(min);
        }

        const totalHeight = Math.max(slots * SLOT_HEIGHT, 200);

        const timeToPixel = (ts) =>
          ((parseTime(ts) - startMin) / interval) * SLOT_HEIGHT;
        const durationToPixel = (dur) => (dur / interval) * SLOT_HEIGHT;

        const updInterval = (v) =>
          setTimeline((prev) => {
            const p = normalizeTl(prev);
            return { ...p, settings: { interval: v } };
          });

        const updateDayEvents = (dayId, updater) =>
          setTimeline((prev) => {
            const p = normalizeTl(prev);
            return {
              ...p,
              days: p.days.map((d) =>
                d.id === dayId ? { ...d, events: updater(d.events || []) } : d,
              ),
            };
          });

        const handleAreaClick = (e) => {
          if (!activeDay) return;
          const rect = e.currentTarget.getBoundingClientRect();
          const y = e.clientY - rect.top;
          const snapped =
            Math.round((startMin + (y / SLOT_HEIGHT) * interval) / interval) *
            interval;
          const clamped = Math.max(
            startMin,
            Math.min(endMin - interval, snapped),
          );
          setModalState({
            isNew: true,
            event: null,
            clickedTime: formatTime(clamped),
          });
        };

        const handleSave = (form) => {
          if (!activeDay) return;
          if (modalState.isNew) {
            updateDayEvents(activeDay.id, (evs) => [
              ...evs,
              { ...form, id: Date.now().toString() },
            ]);
          } else {
            updateDayEvents(activeDay.id, (evs) =>
              evs.map((e) =>
                e.id === modalState.event.id ? { ...e, ...form } : e,
              ),
            );
          }
          setModalState(null);
        };

        const handleDelete = (id) => {
          if (!activeDay) return;
          updateDayEvents(activeDay.id, (evs) =>
            evs.filter((e) => e.id !== id),
          );
          setModalState(null);
        };

        const handleAddDay = ({ name, date }) => {
          const id = "day" + Date.now();
          setTimeline((prev) => {
            const p = normalizeTl(prev);
            return { ...p, days: [...p.days, { id, name, date, events: [] }] };
          });
          setActiveDayId(id);
          setDayModal(null);
        };

        const handleEditDay = ({ name, date }) => {
          setTimeline((prev) => {
            const p = normalizeTl(prev);
            return {
              ...p,
              days: p.days.map((d) =>
                d.id === dayModal.day.id ? { ...d, name, date } : d,
              ),
            };
          });
          setDayModal(null);
        };

        const handleDeleteDay = (id) => {
          setTimeline((prev) => {
            const p = normalizeTl(prev);
            const remaining = p.days.filter((d) => d.id !== id);
            return {
              ...p,
              days: remaining.length ? remaining : DEFAULT_TIMELINE.days,
            };
          });
          if (activeDayId === id) setActiveDayId(null);
          setDayModal(null);
        };

        const sortedEvents = [...events].sort(
          (a, b) => parseTime(a.startTime) - parseTime(b.startTime),
        );

        return (
          <div>

                  style={{

                    color: COLORS.ink,
                    margin: 0,
                  }}
                >
                  {t("tl_title")}
                </h2>
                <p
                  style={{
                    color: COLORS.muted,
                    fontSize: 14,
                    margin: "4px 0 0",
                  }}
                >
                  {t("tl_sub")}
                </p>
              </div>
              <div
                style={{

                  gap: 3,
                  background: COLORS.bg,
                  borderRadius: 10,
                  padding: 3,
                  border: `1px solid ${COLORS.border}`,
                  flexShrink: 0,
                }}
              >
                {INTERVALS.map((iv) => (
                  <button
                    key={iv}
                    onClick={() => updInterval(iv)}
                    style={{
                      padding: "5px 12px",
                      background: interval === iv ? COLORS.rose : "transparent",
                      color: interval === iv ? "#fff" : COLORS.muted,
                      border: "none",
                      borderRadius: 8,
                      cursor: "pointer",
                      fontSize: 12,
                      fontFamily: "'DM Sans', sans-serif",
                      fontWeight: interval === iv ? 500 : 400,
                      transition: "all 0.15s",
                    }}
                  >
                    {iv}
                    {t("tl_min")}
                  </button>
                ))}
              </div>
            </div>

            {/* Day tabs */}
            <div
              style={{
                display: "flex",
                alignItems: "center",
                gap: 6,
                marginBottom: 20,
                flexWrap: "wrap",
              }}

                const isActive = day.id === (activeDay && activeDay.id);
                return (

                    <button
